services:
  turing-universe:
    build: .
    volumes:
      - ./results:/app/results
    command: python3 experiments/run_all.py
  benchmark:
    build: .
    volumes:
      - ./results:/app/results
    command: python3 experiments/benchmark.py
  live:
    build: .
    volumes:
      - ./results:/app/results
    command: python3 experiments/verify_live.py
  bombe:
    build: .
    volumes:
      - ./results:/app/results
    command: python3 experiments/bombe_demo.py --seed 7
